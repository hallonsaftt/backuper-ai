[package]
name = "backup-core"
version = "1.0.0"
edition = "2021"
description = "Claude Backup — jezgro: skeniranje, backup, provera, vraćanje, zakazivanje"
license = "MIT"

[lib]
name = "backup_core"
path = "src/lib.rs"

[[bin]]
name = "claude-backup-cli"
path = "src/bin/cli.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
hex = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
plist = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
regex = "1"
tempfile = "3"
dunce = "1"
base64 = "0.22"
deunicode = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
tauri-winrt-notification = "0.8"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console", "Win32_Storage_FileSystem"] }

[profile.release]
opt-level = 3
