[package]
name = "claude-backup"
version = "1.0.0"
description = "Claude Backup — sigurna kopija Claude razgovora"
edition = "2021"
license = "MIT"

[lib]
name = "claude_backup_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
backup-core = { path = "../core" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
